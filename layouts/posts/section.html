{{ define "title" -}}Blog &middot; James Fennell{{ end }}

{{ define "main" }}

<div id="blog-heading">
    <h1>Blog</h1>
    <span>(<a href="/posts/index.xml">RSS feed</a>)</span>
</div>

<ul id="post-list">
{{ range .Pages }}
    <li>
        <span class="post-date">{{.Date.Format "2006-01-02"}}</span>
        <a href="{{.Permalink}}">{{.Title}}</a>
    </li>
{{ end }}
</ul>

{{ .Content }}
{{ end }}
